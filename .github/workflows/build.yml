name: Build tweaked APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile the patcher
        run: python3 -m py_compile patcher/patch_apk.py patcher/hwu_native.py patcher/rr_tab.py patcher/rr_card.py patcher/thumb.py
      - name: Download the 3.8.0 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          if ! gh release download source-apk -p '*.apk' -D input --clobber; then
            echo "::error::Create a release named source-apk on this repo and attach your Hollywood U 3.8.0 APK. The game is not stored in git."
            exit 1
          fi
      - name: Patch
        run: python3 patcher/patch_apk.py --apk input/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hollywood-u-tweaks
          path: dist/*.apk
          if-no-files-found: error
